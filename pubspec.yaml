name: magic
description: "A Laravel-inspired Flutter framework with Eloquent ORM, routing, and MVC architecture."
version: 0.1.0
homepage: https://magic.fluttersdk.com
repository: https://github.com/fluttersdk/magic
issue_tracker: https://github.com/fluttersdk/magic/issues

topics:
  - framework
  - mvc
  - orm
  - laravel
  - architecture

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  # wind_kit 1.12.0 is the first release under this name and builds on
  # material_ui, so the SDK floor above is its floor.
  wind_kit: ^1.12.0
  meta: ^1.19.0
  dio: ^5.11.1
  flutter_dotenv: ^6.0.1
  go_router: ^18.1.4
  intl: ^0.20.3
  jiffy: ^6.4.5
  path_provider: ^2.1.6
  path: ^1.9.1
  web: ^1.1.2
  crypto: ^3.0.8
  flutter_secure_storage: ^11.2.0
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  url_launcher: ^6.3.3
  logger: ^2.8.0
  yaml: ^3.1.4
  dowel: ^0.0.21
  flutter_test:
    sdk: flutter
  material_ui: ^1.11.0

dev_dependencies:
  cupertino_ui: ^1.1.6
  flutter_lints: ^6.0.0
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2

executables:
  dowel:

flutter:
  assets:
    - assets/stubs/
