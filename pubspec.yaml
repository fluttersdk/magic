name: magic
description: "A Laravel-inspired Flutter framework with Eloquent ORM, routing, and MVC architecture."
version: 0.0.14
homepage: https://magic.fluttersdk.com
repository: https://github.com/fluttersdk/magic
issue_tracker: https://github.com/fluttersdk/magic/issues

topics:
  - framework
  - mvc
  - orm
  - laravel
  - architecture

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  # A FLOOR for a value rather than an API, and this release is what makes it
  # one: `_buildPage` now paints `scaffoldBackgroundColor`, and wind filled that
  # field from its own white and gray-900 until 1.6.1 taught it to follow the
  # `bg-surface` alias an app actually paints its canvas with. On 1.6.0 that is
  # #FFFFFF over #F9FAFB in light and #111827 over #07090C in dark, on every
  # screen, and the dark one is not subtle. Nothing fails to compile below it,
  # which is exactly why the floor has to say so.
  fluttersdk_wind: ^1.6.2
  meta: ^1.16.0
  more: ^4.7.0
  dio: ^5.9.0
  flutter_dotenv: ^6.0.0
  go_router: ">=17.1.0 <19.0.0"
  intl: ^0.20.2
  jiffy: ^6.3.1
  path_provider: ^2.1.2
  path: ^1.9.0
  web: ^1.1.1
  encrypt: ^5.0.3
  flutter_secure_storage: ">=10.0.0 <12.0.0"
  sqlite3: ^3.2.0
  sqlite3_flutter_libs: ^0.6.0+eol
  shared_preferences: ^2.3.2
  share_plus: ">=12.0.1 <14.0.0"
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0
  url_launcher: ^6.3.0
  logger: ^2.6.2
  file_picker: ^12.2.0
  image_picker: ^1.1.2
  faker: ^2.2.0
  web_socket_channel: ^3.0.0
  yaml: ^3.1.3
  fluttersdk_artisan: ^0.0.16
  flutter_test:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

executables:
  artisan:

flutter:
  assets:
    - assets/stubs/
